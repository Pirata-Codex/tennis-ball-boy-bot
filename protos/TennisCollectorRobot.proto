# ---------------------------------------------------------------------------
# TennisCollectorRobot - Side Conveyor Belts + 6-Blade Fan + Low Floor
#
# Chassis-local frame:  +x forward, +y left, +z up, origin on the ground
# directly beneath the centre of the robot.
# ---------------------------------------------------------------------------

PROTO TennisCollectorRobot [
  field SFVec3f    translation    0 0 0
  field SFRotation rotation       0 0 1 0
  field SFString   controller    "tennis_collector"
  field MFString   controllerArgs []
  field SFString   name           "tennis collector"
  field SFColor    bodyColor      0.12 0.30 0.72
]
{
  Robot {
    translation     IS translation
    rotation        IS rotation
    name            IS name
    supervisor      TRUE
    controller      IS controller
    controllerArgs  IS controllerArgs
    boundingObject Box { size 0.002 0.002 0.002 }
    physics Physics {
      density -1
      mass 0.05
    }
    children [

      # ==================================================================
      # ================= CHASSIS =================
      # ==================================================================
      DEF BODY_CHASSIS Solid {
        name       "chassis"
        translation 0 0 0
        contactMaterial "chassis"
        children [

          # ---- main deck (behind the bin, carrying the mast)
          Transform {
            translation -0.15 0 0.06
            children [
              Shape {
                appearance PBRAppearance {
                  baseColor IS bodyColor
                  metalness 0.1
                  roughness  0.45
                }
                geometry Box { size 0.38 0.30 0.06 }
              }
              Transform {
                translation 0 0 -0.035
                children [
                  Shape {
                    appearance PBRAppearance { baseColor 0.08 0.08 0.10 metalness 0.3 roughness 0.7 }
                    geometry Box { size 0.34 0.26 0.02 }
                  }
                ]
              }
            ]
          }

          # bin left wall
          Transform {
            translation 0.20  0.120 0.0825
            children [
              Shape {
                appearance PBRAppearance { baseColor 0.25 0.25 0.28 metalness 0.2 roughness 0.8 }
                geometry Box { size 0.30 0.014 0.125 }
              }
            ]
          }
          # bin right wall
          Transform {
            translation 0.20 -0.120 0.0825
            children [
              Shape {
                appearance PBRAppearance { baseColor 0.25 0.25 0.28 metalness 0.2 roughness 0.8 }
                geometry Box { size 0.30 0.014 0.125 }
              }
            ]
          }
          # bin back wall
          Transform {
            translation 0.057 0 0.0825
            children [
              Shape {
                appearance PBRAppearance { baseColor 0.25 0.25 0.28 metalness 0.2 roughness 0.8 }
                geometry Box { size 0.014 0.24 0.125 }
              }
            ]
          }
          # bin rear lid
          Transform {
            translation 0.16 0 0.150
            children [
              Shape {
                appearance PBRAppearance { baseColor 0.25 0.25 0.28 metalness 0.2 roughness 0.8 }
                geometry Box { size 0.20 0.24 0.012 }
              }
            ]
          }
          # entrance roof hood (clears the fan wheel top at z=0.144)
          Transform {
            translation 0.34 0 0.165
            children [
              Shape {
                appearance PBRAppearance { baseColor 0.20 0.20 0.24 metalness 0.2 roughness 0.8 }
                geometry Box { size 0.18 0.24 0.010 }
              }
            ]
          }

          # ==============================================================
          # STAGE 1: DUAL SIDE-PINCHING CONVEYOR BELTS (Webots Track nodes)
          # ==============================================================
          # Each belt is a 0.26 x 0.024 x 0.060 box angled 0.20 rad inward,
          # bottom at z = 0.015 so it clears a raised pad edge.
          # Centres at y = +/-0.0755 give an inner gap of ~0.178 m at the
          # mouth (x ~ 0.61) and ~0.075 m at the throat (x ~ 0.35), 8 mm wider
          # than the 0.067 m ball. Track moves its whole contact surface along
          # its local x, so a NEGATIVE LinearMotor velocity on BOTH belts sweeps
          # the inner faces rearward into the fan (set_door_rollers() does the
          # sign). Light (0.05 kg, density -1) so the CoM does not move forward.
          # ---- left side conveyor belt ----
          DEF BODY_ARM_ROLLER_LEFT Track {
            name            "armRollerLeft"
            translation     0.48 0.0755 0.045
            rotation        0 0 1 0.20
            contactMaterial "conveyorBelt"
            device [
              LinearMotor {
                name        "armRollerLeftMotor"
                maxForce    6.0
                maxVelocity 2.0
                minPosition -1e6
                maxPosition 1e6
                sound ""
              }
            ]
            children [
              Shape {
                appearance PBRAppearance { baseColor 0.15 0.65 0.25 metalness 0.0 roughness 0.95 }
                geometry Box { size 0.26 0.024 0.060 }
              }
              Transform {
                translation 0.13 0 0
                children [
                  Shape {
                    appearance PBRAppearance { baseColor 0.20 0.20 0.22 roughness 0.8 }
                    geometry Cylinder { radius 0.014 height 0.062 }
                  }
                ]
              }
              Transform {
                translation -0.13 0 0
                children [
                  Shape {
                    appearance PBRAppearance { baseColor 0.20 0.20 0.22 roughness 0.8 }
                    geometry Cylinder { radius 0.014 height 0.062 }
                  }
                ]
              }
            ]
            boundingObject Box { size 0.26 0.024 0.060 }
            physics Physics {
              density -1
              mass 0.05
            }
          }
          # ---- right side conveyor belt ----
          DEF BODY_ARM_ROLLER_RIGHT Track {
            name            "armRollerRight"
            translation     0.48 -0.0755 0.045
            rotation        0 0 1 -0.20
            contactMaterial "conveyorBelt"
            device [
              LinearMotor {
                name        "armRollerRightMotor"
                maxForce    6.0
                maxVelocity 2.0
                minPosition -1e6
                maxPosition 1e6
                sound ""
              }
            ]
            children [
              Shape {
                appearance PBRAppearance { baseColor 0.15 0.65 0.25 metalness 0.0 roughness 0.95 }
                geometry Box { size 0.26 0.024 0.060 }
              }
              Transform {
                translation 0.13 0 0
                children [
                  Shape {
                    appearance PBRAppearance { baseColor 0.20 0.20 0.22 roughness 0.8 }
                    geometry Cylinder { radius 0.014 height 0.062 }
                  }
                ]
              }
              Transform {
                translation -0.13 0 0
                children [
                  Shape {
                    appearance PBRAppearance { baseColor 0.20 0.20 0.22 roughness 0.8 }
                    geometry Cylinder { radius 0.014 height 0.062 }
                  }
                ]
              }
            ]
            boundingObject Box { size 0.26 0.024 0.060 }
            physics Physics {
              density -1
              mass 0.05
            }
          }

          # ==============================================================
          # STAGE 2: 6-BLADE PLASTIC FAN WHEEL (throat scoop)
          # ==============================================================
          # Hub at x = 0.33, z = 0.092; blade tip radius 0.052 -> lowest sweep
          # z = 0.040; hub bottom 0.074 clears the 0.067 ball top (at 0.082 the hub
          # bottom was 0.064 and wedged the ball, 0/1 in mech_test). 68 mm wide so it
          # fits inside the 75 mm belt throat with clearance on both sides.
          # Axis +y: a POSITIVE velocity moves the bottom of the wheel to -x
          # (rearward), rolling the ball under the hub into the bin (verified:
          # +24 captures, -24 repels). Nothing rises from the floor behind it:
          # a ledge there pinned the ball (FINDINGS 6.6). Blades are in BOTH
          # children and the bounding Group so the physics sees them.
          HingeJoint {
            jointParameters HingeJointParameters {
              axis   0 1 0
              anchor 0.33 0 0.092
            }
            device [
              RotationalMotor {
                name        "intakeRoller"
                maxTorque   2.5
                maxVelocity 45
                minPosition -1e6
                maxPosition 1e6
                sound ""
              }
            ]
            endPoint DEF BODY_INTAKE_ROLLER Solid {
              name            "intakeRoller"
              translation     0.33 0 0.092
              contactMaterial "roller"
              children [
                Transform {
                  rotation 1 0 0 1.5708
                  children [
                    Shape {
                      appearance PBRAppearance { baseColor 0.90 0.45 0.10 metalness 0.0 roughness 0.9 }
                      geometry Cylinder { radius 0.018 height 0.068 }
                    }
                  ]
                }
                Transform {
                  translation 0.034 0 0.0
                  rotation 0 1 0 0.0
                  children [ Shape { appearance PBRAppearance { baseColor 0.95 0.55 0.12 roughness 0.9 } geometry Box { size 0.036 0.068 0.005 } } ]
                }
                Transform {
                  translation 0.017 0 0.0294
                  rotation 0 1 0 -1.0472
                  children [ Shape { appearance PBRAppearance { baseColor 0.95 0.55 0.12 roughness 0.9 } geometry Box { size 0.036 0.068 0.005 } } ]
                }
                Transform {
                  translation -0.017 0 0.0294
                  rotation 0 1 0 -2.0944
                  children [ Shape { appearance PBRAppearance { baseColor 0.95 0.55 0.12 roughness 0.9 } geometry Box { size 0.036 0.068 0.005 } } ]
                }
                Transform {
                  translation -0.034 0 0.0
                  rotation 0 1 0 3.1416
                  children [ Shape { appearance PBRAppearance { baseColor 0.95 0.55 0.12 roughness 0.9 } geometry Box { size 0.036 0.068 0.005 } } ]
                }
                Transform {
                  translation -0.017 0 -0.0294
                  rotation 0 1 0 2.0944
                  children [ Shape { appearance PBRAppearance { baseColor 0.95 0.55 0.12 roughness 0.9 } geometry Box { size 0.036 0.068 0.005 } } ]
                }
                Transform {
                  translation 0.017 0 -0.0294
                  rotation 0 1 0 1.0472
                  children [ Shape { appearance PBRAppearance { baseColor 0.95 0.55 0.12 roughness 0.9 } geometry Box { size 0.036 0.068 0.005 } } ]
                }
              ]
              boundingObject Group {
                children [
                  Transform {
                    rotation 1 0 0 1.5708
                    children [ Cylinder { radius 0.018 height 0.068 } ]
                  }
                  Transform {
                    translation 0.034 0 0.0
                    rotation 0 1 0 0.0
                    children [ Box { size 0.036 0.068 0.005 } ]
                  }
                  Transform {
                    translation 0.017 0 0.0294
                    rotation 0 1 0 -1.0472
                    children [ Box { size 0.036 0.068 0.005 } ]
                  }
                  Transform {
                    translation -0.017 0 0.0294
                    rotation 0 1 0 -2.0944
                    children [ Box { size 0.036 0.068 0.005 } ]
                  }
                  Transform {
                    translation -0.034 0 0.0
                    rotation 0 1 0 3.1416
                    children [ Box { size 0.036 0.068 0.005 } ]
                  }
                  Transform {
                    translation -0.017 0 -0.0294
                    rotation 0 1 0 2.0944
                    children [ Box { size 0.036 0.068 0.005 } ]
                  }
                  Transform {
                    translation 0.017 0 -0.0294
                    rotation 0 1 0 1.0472
                    children [ Box { size 0.036 0.068 0.005 } ]
                  }
                ]
              }
              physics Physics {
                density -1
                mass 0.06
                damping Damping { linear 0.05 angular 0.05 }
              }
            }
          }

          # ---- lidar mast ----
          Transform {
            translation -0.28 0 0.30
            children [
              Shape {
                appearance PBRAppearance { baseColor 0.15 0.15 0.17 metalness 0.4 roughness 0.5 }
                geometry Box { size 0.05 0.05 0.50 }
              }
            ]
          }
          Transform {
            translation -0.28 0 0.545
            children [
              Shape {
                appearance PBRAppearance { baseColor 0.15 0.15 0.17 metalness 0.4 roughness 0.5 }
                geometry Box { size 0.05 0.26 0.03 }
              }
            ]
          }

          # ---- rear left drive wheel ----
          HingeJoint {
            jointParameters HingeJointParameters {
              axis   0 1 0
              anchor -0.10  0.185 0.09
            }
            device [
              RotationalMotor {
                name        "leftWheelMotor"
                maxTorque   4.0
                maxVelocity 20
                minPosition -1e6
                maxPosition 1e6
                sound ""
              }
              PositionSensor { name "leftWheelEncoder" }
            ]
            endPoint DEF BODY_WHEEL_LEFT Solid {
              name       "wheelLeft"
              translation -0.10  0.185 0.09
              contactMaterial "wheel"
              children [
                Transform {
                  rotation 1 0 0 1.5708
                  children [
                    Shape {
                      appearance PBRAppearance { baseColor 0.10 0.10 0.12 metalness 0 roughness 0.9 }
                      geometry Cylinder { radius 0.086 height 0.05 }
                    }
                    Shape {
                      appearance PBRAppearance { baseColor 0.55 0.55 0.58 metalness 0.5 roughness 0.4 }
                      geometry Cylinder { radius 0.045 height 0.052 }
                    }
                    Transform { rotation 0 0 1 0.0000 children [ Transform { translation 0.087 0 0 children [ Shape { appearance PBRAppearance { baseColor 0.18 0.18 0.20 roughness 0.95 } geometry Box { size 0.006 0.010 0.052 } } ] } ] }
                    Transform { rotation 0 0 1 0.5236 children [ Transform { translation 0.087 0 0 children [ Shape { appearance PBRAppearance { baseColor 0.18 0.18 0.20 roughness 0.95 } geometry Box { size 0.006 0.010 0.052 } } ] } ] }
                    Transform { rotation 0 0 1 1.0472 children [ Transform { translation 0.087 0 0 children [ Shape { appearance PBRAppearance { baseColor 0.18 0.18 0.20 roughness 0.95 } geometry Box { size 0.006 0.010 0.052 } } ] } ] }
                    Transform { rotation 0 0 1 1.5708 children [ Transform { translation 0.087 0 0 children [ Shape { appearance PBRAppearance { baseColor 0.18 0.18 0.20 roughness 0.95 } geometry Box { size 0.006 0.010 0.052 } } ] } ] }
                    Transform { rotation 0 0 1 2.0944 children [ Transform { translation 0.087 0 0 children [ Shape { appearance PBRAppearance { baseColor 0.18 0.18 0.20 roughness 0.95 } geometry Box { size 0.006 0.010 0.052 } } ] } ] }
                    Transform { rotation 0 0 1 2.6180 children [ Transform { translation 0.087 0 0 children [ Shape { appearance PBRAppearance { baseColor 0.18 0.18 0.20 roughness 0.95 } geometry Box { size 0.006 0.010 0.052 } } ] } ] }
                    Transform { rotation 0 0 1 3.1416 children [ Transform { translation 0.087 0 0 children [ Shape { appearance PBRAppearance { baseColor 0.18 0.18 0.20 roughness 0.95 } geometry Box { size 0.006 0.010 0.052 } } ] } ] }
                    Transform { rotation 0 0 1 3.6652 children [ Transform { translation 0.087 0 0 children [ Shape { appearance PBRAppearance { baseColor 0.18 0.18 0.20 roughness 0.95 } geometry Box { size 0.006 0.010 0.052 } } ] } ] }
                    Transform { rotation 0 0 1 4.1888 children [ Transform { translation 0.087 0 0 children [ Shape { appearance PBRAppearance { baseColor 0.18 0.18 0.20 roughness 0.95 } geometry Box { size 0.006 0.010 0.052 } } ] } ] }
                    Transform { rotation 0 0 1 4.7124 children [ Transform { translation 0.087 0 0 children [ Shape { appearance PBRAppearance { baseColor 0.18 0.18 0.20 roughness 0.95 } geometry Box { size 0.006 0.010 0.052 } } ] } ] }
                    Transform { rotation 0 0 1 5.2360 children [ Transform { translation 0.087 0 0 children [ Shape { appearance PBRAppearance { baseColor 0.18 0.18 0.20 roughness 0.95 } geometry Box { size 0.006 0.010 0.052 } } ] } ] }
                    Transform { rotation 0 0 1 5.7596 children [ Transform { translation 0.087 0 0 children [ Shape { appearance PBRAppearance { baseColor 0.18 0.18 0.20 roughness 0.95 } geometry Box { size 0.006 0.010 0.052 } } ] } ] }
                  ]
                }
              ]
              boundingObject Transform {
                rotation 1 0 0 1.5708
                children [ Cylinder { radius 0.09 height 0.05 } ]
              }
              physics Physics { density -1 mass 0.7 }
            }
          }

          # ---- rear right drive wheel ----
          HingeJoint {
            jointParameters HingeJointParameters {
              axis   0 1 0
              anchor -0.10 -0.185 0.09
            }
            device [
              RotationalMotor {
                name        "rightWheelMotor"
                maxTorque   4.0
                maxVelocity 20
                minPosition -1e6
                maxPosition 1e6
                sound ""
              }
              PositionSensor { name "rightWheelEncoder" }
            ]
            endPoint DEF BODY_WHEEL_RIGHT Solid {
              name       "wheelRight"
              translation -0.10 -0.185 0.09
              contactMaterial "wheel"
              children [
                Transform {
                  rotation 1 0 0 1.5708
                  children [
                    Shape {
                      appearance PBRAppearance { baseColor 0.10 0.10 0.12 metalness 0 roughness 0.9 }
                      geometry Cylinder { radius 0.086 height 0.05 }
                    }
                    Shape {
                      appearance PBRAppearance { baseColor 0.55 0.55 0.58 metalness 0.5 roughness 0.4 }
                      geometry Cylinder { radius 0.045 height 0.052 }
                    }
                    Transform { rotation 0 0 1 0.0000 children [ Transform { translation 0.087 0 0 children [ Shape { appearance PBRAppearance { baseColor 0.18 0.18 0.20 roughness 0.95 } geometry Box { size 0.006 0.010 0.052 } } ] } ] }
                    Transform { rotation 0 0 1 0.5236 children [ Transform { translation 0.087 0 0 children [ Shape { appearance PBRAppearance { baseColor 0.18 0.18 0.20 roughness 0.95 } geometry Box { size 0.006 0.010 0.052 } } ] } ] }
                    Transform { rotation 0 0 1 1.0472 children [ Transform { translation 0.087 0 0 children [ Shape { appearance PBRAppearance { baseColor 0.18 0.18 0.20 roughness 0.95 } geometry Box { size 0.006 0.010 0.052 } } ] } ] }
                    Transform { rotation 0 0 1 1.5708 children [ Transform { translation 0.087 0 0 children [ Shape { appearance PBRAppearance { baseColor 0.18 0.18 0.20 roughness 0.95 } geometry Box { size 0.006 0.010 0.052 } } ] } ] }
                    Transform { rotation 0 0 1 2.0944 children [ Transform { translation 0.087 0 0 children [ Shape { appearance PBRAppearance { baseColor 0.18 0.18 0.20 roughness 0.95 } geometry Box { size 0.006 0.010 0.052 } } ] } ] }
                    Transform { rotation 0 0 1 2.6180 children [ Transform { translation 0.087 0 0 children [ Shape { appearance PBRAppearance { baseColor 0.18 0.18 0.20 roughness 0.95 } geometry Box { size 0.006 0.010 0.052 } } ] } ] }
                    Transform { rotation 0 0 1 3.1416 children [ Transform { translation 0.087 0 0 children [ Shape { appearance PBRAppearance { baseColor 0.18 0.18 0.20 roughness 0.95 } geometry Box { size 0.006 0.010 0.052 } } ] } ] }
                    Transform { rotation 0 0 1 3.6652 children [ Transform { translation 0.087 0 0 children [ Shape { appearance PBRAppearance { baseColor 0.18 0.18 0.20 roughness 0.95 } geometry Box { size 0.006 0.010 0.052 } } ] } ] }
                    Transform { rotation 0 0 1 4.1888 children [ Transform { translation 0.087 0 0 children [ Shape { appearance PBRAppearance { baseColor 0.18 0.18 0.20 roughness 0.95 } geometry Box { size 0.006 0.010 0.052 } } ] } ] }
                    Transform { rotation 0 0 1 4.7124 children [ Transform { translation 0.087 0 0 children [ Shape { appearance PBRAppearance { baseColor 0.18 0.18 0.20 roughness 0.95 } geometry Box { size 0.006 0.010 0.052 } } ] } ] }
                    Transform { rotation 0 0 1 5.2360 children [ Transform { translation 0.087 0 0 children [ Shape { appearance PBRAppearance { baseColor 0.18 0.18 0.20 roughness 0.95 } geometry Box { size 0.006 0.010 0.052 } } ] } ] }
                    Transform { rotation 0 0 1 5.7596 children [ Transform { translation 0.087 0 0 children [ Shape { appearance PBRAppearance { baseColor 0.18 0.18 0.20 roughness 0.95 } geometry Box { size 0.006 0.010 0.052 } } ] } ] }
                  ]
                }
              ]
              boundingObject Transform {
                rotation 1 0 0 1.5708
                children [ Cylinder { radius 0.09 height 0.05 } ]
              }
              physics Physics { density -1 mass 0.7 }
            }
          }

          # ---- front ball casters, each on a passive HingeJoint ----
          # They were bare Solids with Physics and no joint, which FINDINGS 5.1
          # says become independent bodies. The joint keeps them on the chassis;
          # contactMaterial "caster" (0.03 friction) still lets them slide
          # sideways, so pivoting stays free (Phase 8).
          HingeJoint {
            jointParameters HingeJointParameters {
              axis   0 1 0
              anchor 0.15  0.13 0.03
            }
            endPoint DEF BODY_SKID_LEFT Solid {
              name            "skidLeft"
              translation     0.15  0.13 0.03
              contactMaterial "caster"
              children [
                Shape {
                  appearance PBRAppearance { baseColor 0.35 0.35 0.38 metalness 0.6 roughness 0.3 }
                  geometry Sphere { radius 0.03 }
                }
              ]
              boundingObject Sphere { radius 0.03 }
              physics Physics { density -1 mass 0.4 }
            }
          }
          HingeJoint {
            jointParameters HingeJointParameters {
              axis   0 1 0
              anchor 0.15 -0.13 0.03
            }
            endPoint DEF BODY_SKID_RIGHT Solid {
              name            "skidRight"
              translation     0.15 -0.13 0.03
              contactMaterial "caster"
              children [
                Shape {
                  appearance PBRAppearance { baseColor 0.35 0.35 0.38 metalness 0.6 roughness 0.3 }
                  geometry Sphere { radius 0.03 }
                }
              ]
              boundingObject Sphere { radius 0.03 }
              physics Physics { density -1 mass 0.4 }
            }
          }

          Lidar {
            name "lidarLeft"
            translation -0.28  0.17 0.50
            rotation    0 0 1 0.85
            fieldOfView         2.6
            horizontalResolution 128
            numberOfLayers      1
            verticalFieldOfView 0.2
            minRange            0.05
            near                0.02
            maxRange            8
            type                "fixed"
            projection          "cylindrical"
            noise               0.01
            defaultFrequency    25
          }
          Lidar {
            name "lidarRight"
            translation -0.28 -0.17 0.50
            rotation    0 0 1 -0.85
            fieldOfView         2.6
            horizontalResolution 128
            numberOfLayers      1
            verticalFieldOfView 0.2
            minRange            0.05
            near                0.02
            maxRange            8
            type                "fixed"
            projection          "cylindrical"
            noise               0.01
            defaultFrequency    25
          }
          Lidar {
            name "bumperLidar"
            translation 0.50 0 0.30
            fieldOfView         2.8
            horizontalResolution 96
            numberOfLayers      1
            verticalFieldOfView 0.1
            minRange            0.05
            near                0.02
            maxRange            1.20
            type                "fixed"
            projection          "cylindrical"
            noise               0.005
            defaultFrequency    25
          }

          GPS {
            name "gps"
            translation 0 0 0.30
            resolution 0.004
          }
          Gyro {
            name "gyro"
            translation 0 0 0.30
          }
        ]
        boundingObject Group {
          children [
            Transform {
              translation -0.15 0 0.06
              children [ Box { size 0.38 0.30 0.06 } ]
            }
            Transform {
              translation -0.15 0 0.025
              children [ Box { size 0.34 0.26 0.02 } ]
            }
            Transform {
              translation 0.20  0.120 0.0825
              children [ Box { size 0.30 0.014 0.125 } ]
            }
            Transform {
              translation 0.20 -0.120 0.0825
              children [ Box { size 0.30 0.014 0.125 } ]
            }
            Transform {
              translation 0.057 0 0.0825
              children [ Box { size 0.014 0.24 0.125 } ]
            }
            Transform {
              translation 0.16 0 0.150
              children [ Box { size 0.20 0.24 0.012 } ]
            }
            Transform {
              translation 0.34 0 0.165
              children [ Box { size 0.18 0.24 0.010 } ]
            }
            # (no bin floor or ledge in the collision: the chassis rides ~2 deg
            # nose-up, which lifts any edge at x = 0.30 to ball-equator height
            # and pins the ball under the fan; balls rest on the court instead)
            # (the conveyor belts are separate jointed Solids with their own
            # collision, so they are NOT part of the chassis bounding object)
            Transform {
              translation -0.28 0 0.30
              children [ Box { size 0.05 0.05 0.50 } ]
            }
            Transform {
              translation -0.28 0 0.545
              children [ Box { size 0.05 0.26 0.03 } ]
            }
          ]
        }
        physics Physics {
          density -1
          mass 12
          damping Damping { linear 0.02 angular 0.15 }
        }
      }
    ]
  }
}
