# ---------------------------------------------------------------------------
# TennisCollectorRobot  --  REDESIGN (branch: redesign)
#
# A ground-up rebuild following proven ball-collector practice (tennis-ball
# retrieval patents + FRC/VEX "full-width over-the-bumper" intakes):
#
#   * FULL-WIDTH front intake roller, mounted just under a ball-diameter above
#     the floor, textured and spun so its lower-front surface sweeps rearward.
#     A ball ANYWHERE across the front is taken in, so the robot never has to
#     centre a ball precisely -- which removes the whole class of "drove past
#     the off-centre ball / wedged it by a wheel" failures of the old rig.
#   * A FLUSH floor-level hopper behind a low lip: the ball is swept over a
#     12 mm lip (a rigid ball rolls over that easily when driven) onto a bin
#     floor at court level, so nothing is ever lifted over a ball-height edge.
#   * A smooth, backing-plated throat (no side pockets / dead zones) so a ball
#     is never pushed into a gap it can wedge in.
#   * Differential drive with LOW-FRICTION BALL CASTERS front and rear instead
#     of fixed cylinder skids, so the base pivots freely and balls roll around
#     the round casters instead of jamming against a flat skid edge.
#
# Chassis-local frame:  +x forward, +y left, +z up, origin on the ground
# directly beneath the centre of the robot.  Ride height 0.06 m (wheel radius).
# ---------------------------------------------------------------------------

PROTO TennisCollectorRobot [
  field SFVec3f    translation    0 0 0
  field SFRotation rotation       0 0 1 0
  field SFString   controller    "tennis_collector"
  field MFString   controllerArgs []
  field SFString   name           "tennis collector"
  field SFColor    bodyColor      0.12 0.30 0.72
]
{
  Robot {
    translation     IS translation
    rotation        IS rotation
    name            IS name
    supervisor      TRUE
    controller      IS controller
    controllerArgs  IS controllerArgs
    boundingObject Box { size 0.002 0.002 0.002 }
    physics Physics { density -1 mass 0.05 }
    children [

      DEF BODY_CHASSIS Solid {
        name       "chassis"
        translation 0 0 0
        contactMaterial "chassis"
        children [

          # ============================================================
          # REAR DECK  (only over the rear axle + mast, so the HOPPER IS
          # OPEN-TOPPED and a 0.067 m ball fits into the bin -- the whole-deck
          # version had a 0.05 m roof over the hopper that the ball could not
          # fit under.)
          # ============================================================
          Transform {
            translation -0.19 0 0.075
            children [
              Shape {
                appearance PBRAppearance { baseColor IS bodyColor metalness 0.1 roughness 0.45 }
                geometry Box { size 0.16 0.40 0.05 }
              }
            ]
          }

          # ============================================================
          # HOPPER  (full-width, floor-level bin behind the intake)
          # Floor at z=0.004 (flush with the court); side + back walls;
          # a 12 mm entry lip at the front that the roller sweeps balls over.
          # ============================================================
          # bin floor (x = -0.22 .. 0.16, full width)
          Transform {
            translation -0.03 0 0.006
            children [
              Shape {
                appearance PBRAppearance { baseColor 0.20 0.20 0.22 metalness 0.1 roughness 0.8 }
                geometry Box { size 0.38 0.38 0.008 }
              }
            ]
          }
          # entry lip (x = 0.16, height 12 mm) -- low enough for a driven ball
          # to roll over, high enough to retain a resting one
          Transform {
            translation 0.16 0 0.006
            children [
              Shape {
                appearance PBRAppearance { baseColor 0.28 0.28 0.30 metalness 0.2 roughness 0.8 }
                geometry Box { size 0.010 0.38 0.012 }
              }
            ]
          }
          # left bin wall
          Transform {
            translation -0.03 0.192 0.055 children [
              Shape { appearance PBRAppearance { baseColor 0.25 0.25 0.28 roughness 0.8 }
                geometry Box { size 0.38 0.016 0.10 } } ]
          }
          # right bin wall
          Transform {
            translation -0.03 -0.192 0.055 children [
              Shape { appearance PBRAppearance { baseColor 0.25 0.25 0.28 roughness 0.8 }
                geometry Box { size 0.38 0.016 0.10 } } ]
          }
          # back wall
          Transform {
            translation -0.225 0 0.055 children [
              Shape { appearance PBRAppearance { baseColor 0.25 0.25 0.28 roughness 0.8 }
                geometry Box { size 0.016 0.38 0.10 } } ]
          }

          # ============================================================
          # INTAKE SIDE PLATES  (smooth throat, no pockets)
          # Short vertical plates just outside the roller ends that keep a ball
          # from squirting off the side into the wheels; flush with the bin
          # walls so there is no gap to wedge in.
          # ============================================================
          Transform {
            translation 0.28 0.192 0.045 children [
              Shape { appearance PBRAppearance { baseColor 0.22 0.22 0.25 roughness 0.8 }
                geometry Box { size 0.22 0.016 0.08 } } ]
          }
          Transform {
            translation 0.28 -0.192 0.045 children [
              Shape { appearance PBRAppearance { baseColor 0.22 0.22 0.25 roughness 0.8 }
                geometry Box { size 0.22 0.016 0.08 } } ]
          }

          # ============================================================
          # DUAL INTAKE ROLLERS  (vertical, forming a ball-width nip)
          # Two powered vertical rollers at the mouth, one each side. The ball
          # enters the gap, is gripped on its LEFT and RIGHT by the roller
          # surfaces (not pinned above by a transverse drum -- a single drum is
          # unavoidably a barrier: low enough to grip is low enough to block),
          # and the counter-rotating rollers drag it REARWARD through the nip
          # into the open-top bin. This is the proven dual-roller intake (≈3%
          # error in the literature) and the "powered arms that move the ball
          # to centre" the user asked for. Inner faces at y=+/-0.033 -> a 0.066 m
          # nip, just under the ball, so both faces grip. Driven by
          # set_door_rollers (armRollerLeftMotor +, armRollerRightMotor -).
          # ------- left intake roller (axis vertical) -------
          HingeJoint {
            jointParameters HingeJointParameters { axis 0 0 1 anchor 0.18 0.073 0.050 }
            device [
              RotationalMotor { name "armRollerLeftMotor" maxTorque 2.5 maxVelocity 60 minPosition -1e6 maxPosition 1e6 sound "" }
            ]
            endPoint DEF BODY_ARM_ROLLER_LEFT Solid {
              name "armRollerLeft"
              translation 0.18 0.073 0.050
              contactMaterial "roller"
              children [
                Shape { appearance PBRAppearance { baseColor 0.90 0.45 0.10 roughness 1.0 } geometry Cylinder { radius 0.040 height 0.08 } }
              ]
              boundingObject Cylinder { radius 0.040 height 0.08 }
              physics Physics { density -1 mass 0.12 damping Damping { linear 0.05 angular 0.05 } }
            }
          }
          # ------- right intake roller -------
          HingeJoint {
            jointParameters HingeJointParameters { axis 0 0 1 anchor 0.18 -0.073 0.050 }
            device [
              RotationalMotor { name "armRollerRightMotor" maxTorque 2.5 maxVelocity 60 minPosition -1e6 maxPosition 1e6 sound "" }
            ]
            endPoint DEF BODY_ARM_ROLLER_RIGHT Solid {
              name "armRollerRight"
              translation 0.18 -0.073 0.050
              contactMaterial "roller"
              children [
                Shape { appearance PBRAppearance { baseColor 0.90 0.45 0.10 roughness 1.0 } geometry Cylinder { radius 0.040 height 0.08 } }
              ]
              boundingObject Cylinder { radius 0.040 height 0.08 }
              physics Physics { density -1 mass 0.12 damping Damping { linear 0.05 angular 0.05 } }
            }
          }

          # ---- lidar mast ----
          Transform {
            translation -0.22 0 0.26 children [
              Shape { appearance PBRAppearance { baseColor 0.15 0.15 0.17 metalness 0.4 roughness 0.5 }
                geometry Box { size 0.05 0.05 0.42 } } ]
          }
          Transform {
            translation -0.22 0 0.47 children [
              Shape { appearance PBRAppearance { baseColor 0.15 0.15 0.17 metalness 0.4 roughness 0.5 }
                geometry Box { size 0.05 0.26 0.03 } } ]
          }

          # ---- left drive wheel (centreline-ish: x=-0.05 for pivot agility) ----
          HingeJoint {
            jointParameters HingeJointParameters { axis 0 1 0 anchor -0.05 0.22 0.060 }
            device [
              RotationalMotor { name "leftWheelMotor" maxTorque 5.0 maxVelocity 25 minPosition -1e6 maxPosition 1e6 sound "" }
              PositionSensor { name "leftWheelEncoder" }
            ]
            endPoint DEF BODY_WHEEL_LEFT Solid {
              name "wheelLeft"
              translation -0.05 0.22 0.060
              contactMaterial "wheel"
              children [
                Transform { rotation 1 0 0 1.5708 children [
                  Shape { appearance PBRAppearance { baseColor 0.10 0.10 0.12 roughness 0.9 } geometry Cylinder { radius 0.060 height 0.04 } }
                ] }
              ]
              boundingObject Transform { rotation 1 0 0 1.5708 children [ Cylinder { radius 0.060 height 0.04 } ] }
              physics Physics { density -1 mass 0.6 }
            }
          }
          # ---- right drive wheel ----
          HingeJoint {
            jointParameters HingeJointParameters { axis 0 1 0 anchor -0.05 -0.22 0.060 }
            device [
              RotationalMotor { name "rightWheelMotor" maxTorque 5.0 maxVelocity 25 minPosition -1e6 maxPosition 1e6 sound "" }
              PositionSensor { name "rightWheelEncoder" }
            ]
            endPoint DEF BODY_WHEEL_RIGHT Solid {
              name "wheelRight"
              translation -0.05 -0.22 0.060
              contactMaterial "wheel"
              children [
                Transform { rotation 1 0 0 1.5708 children [
                  Shape { appearance PBRAppearance { baseColor 0.10 0.10 0.12 roughness 0.9 } geometry Cylinder { radius 0.060 height 0.04 } }
                ] }
              ]
              boundingObject Transform { rotation 1 0 0 1.5708 children [ Cylinder { radius 0.060 height 0.04 } ] }
              physics Physics { density -1 mass 0.6 }
            }
          }

          # ---- ball casters (low-friction spheres, slide any direction) ----
          # The intake/bin is front-heavy, so the front needs support too; two
          # front casters at the corners (outside the ball path, y=+/-0.185) plus
          # one rear caster give a stable 5-point stance that still pivots freely.
          DEF BODY_CASTER_REAR Solid {
            name "casterRear"
            translation -0.19 0 0.030
            contactMaterial "caster"
            children [
              Shape { appearance PBRAppearance { baseColor 0.35 0.35 0.38 metalness 0.6 roughness 0.3 } geometry Sphere { radius 0.030 } }
            ]
            boundingObject Sphere { radius 0.030 }
            physics Physics { density -1 mass 0.2 }
          }
          DEF BODY_CASTER_FL Solid {
            name "casterFrontLeft"
            translation 0.26 0.185 0.030
            contactMaterial "caster"
            children [
              Shape { appearance PBRAppearance { baseColor 0.35 0.35 0.38 metalness 0.6 roughness 0.3 } geometry Sphere { radius 0.030 } }
            ]
            boundingObject Sphere { radius 0.030 }
            physics Physics { density -1 mass 0.2 }
          }
          DEF BODY_CASTER_FR Solid {
            name "casterFrontRight"
            translation 0.26 -0.185 0.030
            contactMaterial "caster"
            children [
              Shape { appearance PBRAppearance { baseColor 0.35 0.35 0.38 metalness 0.6 roughness 0.3 } geometry Sphere { radius 0.030 } }
            ]
            boundingObject Sphere { radius 0.030 }
            physics Physics { density -1 mass 0.2 }
          }

          # ============================================================
          # SENSORS  (two mast lidars, GPS, gyro)
          # ============================================================
          Lidar {
            name "lidarLeft" translation -0.22 0.17 0.43 rotation 0 0 1 0.85
            fieldOfView 2.6 horizontalResolution 128 numberOfLayers 1
            verticalFieldOfView 0.2 minRange 0.05 near 0.02 maxRange 8
            type "fixed" projection "cylindrical" noise 0.01 defaultFrequency 25
          }
          Lidar {
            name "lidarRight" translation -0.22 -0.17 0.43 rotation 0 0 1 -0.85
            fieldOfView 2.6 horizontalResolution 128 numberOfLayers 1
            verticalFieldOfView 0.2 minRange 0.05 near 0.02 maxRange 8
            type "fixed" projection "cylindrical" noise 0.01 defaultFrequency 25
          }
          GPS { name "gps" translation 0 0 0.26 resolution 0.004 }
          Gyro { name "gyro" translation 0 0 0.26 }
        ]

        boundingObject Group {
          children [
            Transform { translation -0.19 0 0.075 children [ Box { size 0.16 0.40 0.05 } ] }
            Transform { translation -0.03 0 0.006 children [ Box { size 0.38 0.38 0.008 } ] }
            Transform { translation 0.16 0 0.006 children [ Box { size 0.010 0.38 0.012 } ] }
            Transform { translation -0.03 0.192 0.055 children [ Box { size 0.38 0.016 0.10 } ] }
            Transform { translation -0.03 -0.192 0.055 children [ Box { size 0.38 0.016 0.10 } ] }
            Transform { translation -0.225 0 0.055 children [ Box { size 0.016 0.38 0.10 } ] }
            Transform { translation 0.28 0.192 0.045 children [ Box { size 0.22 0.016 0.08 } ] }
            Transform { translation 0.28 -0.192 0.045 children [ Box { size 0.22 0.016 0.08 } ] }
            Transform { translation -0.22 0 0.26 children [ Box { size 0.05 0.05 0.42 } ] }
          ]
        }
        physics Physics { density -1 mass 11 damping Damping { linear 0.02 angular 0.15 } }
      }
    ]
  }
}
